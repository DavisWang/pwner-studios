<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Dstris poster</title>
  <desc id="desc">Split Tetris boards versus CPU with stacked tetromino blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1118" />
      <stop offset="100%" stop-color="#151d28" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg)" />
  <!-- Split boards -->
  <g stroke="#5ad4ff" stroke-opacity="0.25" stroke-width="2" fill="none">
    <rect x="96" y="72" width="168" height="336" rx="4" />
    <rect x="696" y="72" width="168" height="336" rx="4" />
  </g>
  <!-- Left stack (player) -->
  <g transform="translate(112 380)">
    <rect width="32" height="32" fill="#00f0f0" rx="2" />
    <rect x="36" width="32" height="32" fill="#f0f000" rx="2" />
    <rect x="72" width="32" height="32" fill="#f0a000" rx="2" />
    <rect y="-36" x="36" width="32" height="32" fill="#a000f0" rx="2" />
    <rect y="-72" width="32" height="32" fill="#00f000" rx="2" />
  </g>
  <!-- Right stack (CPU) -->
  <g transform="translate(712 356)">
    <rect width="32" height="32" fill="#f00000" rx="2" opacity="0.92" />
    <rect x="36" width="32" height="32" fill="#0000f0" rx="2" opacity="0.92" />
    <rect x="72" width="32" height="32" fill="#f0a000" rx="2" opacity="0.92" />
    <rect y="-36" x="36" width="32" height="32" fill="#00f0f0" rx="2" opacity="0.92" />
    <rect y="-72" width="64" height="32" fill="#f0f000" rx="2" opacity="0.92" />
  </g>
  <!-- VS -->
  <text x="480" y="248" fill="#fdf6e8" font-family="monospace" font-size="72" font-weight="700" text-anchor="middle" filter="url(#glow)">VS</text>
  <text x="480" y="298" fill="#5ad4ff" font-family="monospace" font-size="24" letter-spacing="8" text-anchor="middle" opacity="0.85">CPU</text>
  <!-- Title -->
  <text x="76" y="536" fill="#fdf6e8" font-family="monospace" font-size="52" font-weight="700" letter-spacing="4">DSTRIS</text>
  <text x="78" y="572" fill="#5ad4ff" font-family="monospace" font-size="18" letter-spacing="3">VS CPU · SRS · GARBAGE QUEUE</text>
</svg>
